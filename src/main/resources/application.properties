spring.application.name=HospitalManagmentSystemProject


# --------------------------
# Database Connection
# --------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/hospitaldb
spring.datasource.username=root
spring.datasource.password=Shlok
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------
# JPA / Hibernate Settings
# --------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update  # options: none, validate, update, create, create-drop
spring.jpa.show-sql=true              # print SQL in console
spring.jpa.properties.hibernate.format_sql=true